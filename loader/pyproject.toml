[tool.poetry]
name = "pango-loader"
description = "Elasticsearch data loader for the PAN-GO Humana Functionome site"
version = "0.0.2"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^1.5"
requests = "^2.28"
elasticsearch = "^8.5"
pydantic = ">=1.10"
pydantic-settings = ">=2.0"
ijson = "^3.1"
packaging = "^21.3"
python-dotenv = "^0.21"
numpy = "^1.23"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
