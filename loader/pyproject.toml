[project]
name = "pango-loader"
version = "0.0.2"
description = "Elasticsearch data loader for the PAN-GO Humana Functionome site"
requires-python = ">=3.13"
dependencies = [
    # pandas 1.x / numpy 1.x have no Python 3.13 wheels.
    "pandas>=3.0,<4",
    "requests>=2.28,<3",
    # The client major version must match the Elasticsearch server (8.5.0 in docker-compose).
    "elasticsearch>=8.5,<9",
    "pydantic>=1.10",
    "pydantic-settings>=2.0",
    "ijson>=3.1,<4",
    "packaging>=21.3,<22",
    "python-dotenv>=0.21,<0.22",
    "numpy>=2.1,<3",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=7.0,<8",
]

[tool.uv]
# An application, not a library: install its dependencies only.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra lists skipped/xfailed tests with their reasons (known bugs are xfail).
addopts = "-ra"
# A known bug that gets fixed turns its xfail into a failure, so the marker gets removed.
xfail_strict = true
