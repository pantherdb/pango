[tool.poetry]
name = "pango-loader"
description = "Elasticsearch data loader for the PAN-GO Humana Functionome site"
version = "0.0.2"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^1.5"
requests = "^2.28"
elasticsearch = "^8.5"
pydantic = ">=1.10"
pydantic-settings = ">=2.0"
ijson = "^3.1"
packaging = "^21.3"
python-dotenv = "^0.21"
numpy = "^1.23"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra lists skipped/xfailed tests with their reasons (known bugs are xfail).
addopts = "-ra"
# A known bug that gets fixed turns its xfail into a failure, so the marker gets removed.
xfail_strict = true
filterwarnings = [
    # pandas 1.5 calls a numpy API deprecated in numpy 1.25; noise from the pinned versions.
    "ignore:np.find_common_type is deprecated:DeprecationWarning",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
